<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ book.title }} · 目录</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="toc-page">

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      书架
    </a>
    <a href="{{ url_for('read', book_id=book.id, chap_num=0) }}" class="btn-upload-open">开始阅读</a>
  </div>
</header>

<main class="toc-main">
  <div class="toc-header" style="border-left: 5px solid {{ book.cover_color }}">
    <div class="toc-cover-dot" style="background:{{ book.cover_color }}">{{ book.title[0] }}</div>
    <div>
      <h1 class="toc-title">{{ book.title }}</h1>
      <p class="toc-author">{{ book.author }}</p>
      <p class="toc-stats">{{ book.total_chaps }} 章 · {{ '{:,}'.format(book.total_chars) }} 字 · {{ book.created_at[:10] }} 导入</p>
    </div>
  </div>

  <div class="toc-search-row">
    <input type="text" id="chapSearch" placeholder="搜索章节名…" class="chap-search-input">
  </div>

  <ol class="chap-list" id="chapList">
    {% for c in chapters %}
    <li class="chap-item" data-title="{{ c.title }}">
      <a href="{{ url_for('read', book_id=book.id, chap_num=c.chap_num) }}" class="chap-link">
        <span class="chap-num">{{ c.chap_num + 1 }}</span>
        <span class="chap-title-text">{{ c.title }}</span>
        <span class="chap-chars">{{ '{:,}'.format(c.char_count) }} 字</span>
      </a>
    </li>
    {% endfor %}
  </ol>
</main>

<script>
document.getElementById('chapSearch').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('#chapList .chap-item').forEach(li => {
    li.style.display = li.dataset.title.toLowerCase().includes(q) ? '' : 'none';
  });
});
</script>
</body>
</html>
